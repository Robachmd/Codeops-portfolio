<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <link rel="stylesheet" href="../style/habesha_eatery.css">
</head>
<body>
    <h1 style="margin: 50px 300px 0 300px;">WELCOME TO HABESHA EATERY</h1>
    <form class="loginpage" action="./habesha_eatery.html">
        <h1 id="loginhead">Sign-up</h1>
        <label for="fname">First Name</label>
        <input type="text" id="fname" required>
        <br>
        <br>
        <label for="lname">Last Name</label>
        <input type="text" id="fname" required>
        <br>
        <br>
        <label for="tel">Phone</label>
        <input id="tel" name="tel" type="tel"pattern="\+251[79][0-9]{8}" required aria-describedby="tel-help">
        <p id="tel-help">Format: +251</p>        
        <br>
        
        <label for="pass">Password</label>
        <input type="password" id="pass"  placeholder="Enter passwoords" required>
        <br>
        <br>
        <label for="confirm">Confirm</label>
        <input type="password" id="confirm" placeholder="Confirm passwoords" required>
        <br>
        <br>
        <button type="submit" class="Login">Sign-Up</button>  
        <p>Already have an account? <a style="color: rgb(216, 9, 9)", href="./login.html">Login</a></p>
    </form>
    
    
</body>
</html>
