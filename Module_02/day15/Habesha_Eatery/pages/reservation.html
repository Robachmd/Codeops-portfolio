<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>reservation</title>
    <link rel="stylesheet" href="../style/habesha_eatery.css">
</head>
<body>
    <form action="/Module_02/day15/Habesha_Eatery/index.html">
        <div class="reserve">
            <h1>Reserve Your Spot Now</h1>
            <label for="name">Full Name</label>
            <input type="text" id="name" required>
            <br>
            <br>
            <label for="guest">Number Of Guests</label>
            <input type="number" id="guest" min="1" max="20" required>
            <br>
            <br>
            <label for="table">Table Number</label>
            <select name="Number" id="table" required>
                <option value="Number">1</option>
                <option value="Number">2</option>
                <option value="Number">3</option>
                <option value="Number">4</option>
                <option value="Number">5</option>
                <option value="Number">6</option>
                <option value="Number">7</option>
                <option value="Number">9</option>
                <option value="Number">10</option>
                <option value="Number">11</option>
                <option value="Number">12</option>
                <option value="Number">12</option>
            </select>
            <br>
            <br>
            <label for="date">Date of Events</label>
            <input type="datetime-local" name="date" id="date" required>
            <br>
            <br>
            <button type="submit" class="Login">Reserve</button>
        
    
        </div>
    

    </form>
    <footer class="nav-bar-footer">
        <div  class="foot">
            <h1><a href="about.html">About Us</a></h1>
            <h1><a href="/Module_02/day15/Habesha_Eatery/">Back To Home</a></h1>
        </div>
    </footer>

</body>
</html>
