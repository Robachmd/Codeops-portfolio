<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Color Palette</title>

    <style>
        :root {
            --blue-color: #3498db;
            --red-color: #e74c3c;
            --green-color: #2ecc71;

            --blue-rgb: rgb(52, 152, 219);
            --red-rgb: rgb(231, 76, 60);
            --green-rgb: rgb(46, 204, 113);

            --blue-hsl: hsl(204, 70%, 53%);
            --red-hsl: hsl(6, 78%, 57%);
            --green-hsl: hsl(145, 63%, 49%);

            --blue-hover: hsl(204, 70%, 70%);
            --red-hover: hsl(6, 78%, 75%);
            --green-hover: hsl(145, 63%, 70%);
        }


        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 30px;
        }


        .hex {
            background-color: var(--blue-color);
        }


        .rgb {
            background-color: var(--red-rgb);
        }


        .hsl {
            background-color: var(--green-hsl);
        }


        button {
            margin: 10px;
            padding: 15px 30px;
            border: none;
            color: white;
            font-size: 18px;
            cursor: pointer;
            border-radius: 8px;
        }


        .blue-btn {
            background-color: var(--blue-hsl);
        }

        .blue-btn:hover {
            background-color: var(--blue-hover);
        }


        .red-btn {
            background-color: var(--red-hsl);
        }

        .red-btn:hover {
            background-color: var(--red-hover);
        }


        .green-btn {
            background-color: var(--green-hsl);
        }

        .green-btn:hover {
            background-color: var(--green-hover);
        }

    </style>
</head>


<body>

    <h1>My Color Palette</h1>

    <h2 class="hex">HEX Color: #3498db</h2>

    <h2 class="rgb">RGB Color: rgb(231, 76, 60)</h2>

    <h2 class="hsl">HSL Color: hsl(145, 63%, 49%)</h2>


    <h2>Hover Buttons</h2>

    <button class="blue-btn">
        Blue Hover
    </button>

    <button class="red-btn">
        Red Hover
    </button>

    <button class="green-btn">
        Green Hover
    </button>


</body>
</html>
