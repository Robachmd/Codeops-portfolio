<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0"
    >
    <title>Addis Eats</title>
    <link rel="stylesheet" href="./style.css"
    >
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="logo">
                <img src="./images/logo.png" alt="Addis Eats logo"
                >
            </div>
            <div class="brand">
                <h1>Addis Eats</h1>
                <p>
                    Ethiopian food - Addis Ababa
                </p>
            </div>
            <div class="search-wrapper">
                <input type="search" id="search" placeholder="Search Doro Wat, Shiro..."
                >
            </div>
        </header>
        <main class="main">
            <p class="loading" id="loading"
            >
                Loading menu...
            </p>
            <section class="menu-category"  id="breakfast-category">
                <h1>Breakfast</h1>
                <div class="menu-grid" id="breakfast-menu"
                ></div>
            </section>
            <section class="menu-category" id="main-category">
                <h1>Main Dishes</h1>
                <div class="menu-grid" id="main-menu"
                ></div>
            </section>
            <section class="menu-category" id="vegetarian-category">
                <h1>Vegetarian Dishes</h1>
                <div class="menu-grid" id="vegetarian-menu"
                ></div>
            </section>
            <section class="menu-category" id="side-category">
                <h1>Side Dishes</h1>
                <div
                    class="menu-grid"
                    id="side-menu"
                ></div>
            </section>
            <p id="no-results" class="no-results"
            >
                No dishes found
            </p>
        </main>
        <aside id="cart" aria-label="Your order"
        >
            <div class="cart-header">
                <h2>Your Order</h2>
                <span id="cart-count">
                    0 items
                </span>
            </div>
            <div id="cart-items">
                <p class="empty-cart">
                    Your cart is empty
                </p>
            </div>
            <div class="cart-total">
                <span>Total</span>
                <strong id="cart-total">
                    0 ETB
                </strong>
            </div>
            <button type="button" id="clear-cart" class="clear-cart"
            >
                Remove
            </button>
            <section class="checkout">

                <h2>Checkout</h2>
            
                <form id="checkout-form">
            
                    <label for="customer-name">
                        Name
                    </label>
            
                    <input type="text" id="customer-name"
                    >
            
                    <label for="customer-phone">
                        Phone
                    </label>
                    <input type="tel" id="customer-phone">
                    <p id="checkout-error"></p>
                    <button type="submit" class="place-order">
                        Place Order
                    </button>
                </form>
                <p id="order-confirmation"></p>
            
            </section>
    
        </aside>
        <footer class="footer">
            <div class="footer-content">
                <h2>Addis Eats</h2>
                <p>
                    Authentic Ethiopian food made
                    for Addis Ababa.
                </p>
            </div>
            <p class="copyright">
                © 2026 Addis Eats.
                All rights reserved.
            </p>
        </footer>
    </div>
    <script src="./app.js"></script>
</body>
</html>
