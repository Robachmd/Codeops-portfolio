<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
    <style>
        body{
            background-color: rgb(227, 247, 247);
        }
        #loginpage{
                width: 300px;
                margin: 100px auto;
                padding: 20px;
                border: 2px solid rgb(196, 167, 167);
                border-radius: 5px;
                background-color: rgb(164, 196, 222);
            }
            #login{
                border-radius: 2px;

            }
    </style>
</head>
<body>
    <form id="loginpage" >
        <label for="fname">First Name</label>
        <input type="text" id="fname">
        <br>
        <br>
        <label for="tele">Tel:</label>
        <input type="tel" id="tele" pattern="09[0-9]{8}" title="Format: 0911223344"
        required>
        <br>
        <br>
        <label for="guest">Guest</label>
        <input type="number" id="guest" min="1" max="20">
        <br>
        <br>
        <label for="date">Date of reservation</label>
        <input type="datetime-local" id="date">
        <br>
        <br>
        <label for="pass">Password</label>
        <input type="password" id="pass"  placeholder="enter passwoords">
        <br>
        <br>
        <label for="confirm">Confirm</label>
        <input type="password" id="confirm" placeholder="confirm passwoords">
        <br>
        <br>
        <a  href="./index.html" type="button" id="Login" >Login</a>
    
    </form>
</body>
</html>
