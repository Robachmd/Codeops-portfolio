<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- BEFORE (Inaccessible) -->

    <div>Submit</div>
    
    <input type="text">
    
    <img src="images/injera.jpg">
    
    
    <!-- AFTER (Accessible) -->
    
    <!-- Fix 1:
        Replaced the div with a button.
        Screen readers recognize it as a button, and keyboard users can
        access it with Tab and activate it using Enter or Space.
    -->
    <button type="button">Submit</button>
    
    <!-- Fix 2:
        Added a label connected to the input.
        Screen readers announce the purpose of the input, and clicking
        the label focuses the input field.
    -->
    <label for="fullname">Full Name</label>
    <input type="text" id="fullname" name="fullname">
    
    <!-- Fix 3:
        Added meaningful alt text.
        Screen readers describe the image, and the text appears if the
        image cannot be loaded.
    -->
    <img src="images/injera.jpg"
        alt="Traditional Ethiopian injera served with a variety of colorful stews">
</body>
</html>
