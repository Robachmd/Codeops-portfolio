<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="./style.css">
</head>
<body>
    <form class="signup" id="signup">
        <label for="name">First Name</label>
        <input type="text" id="name" placeholder="enter name > 2 character">
        <br>
        <br>
        <label for="phone">Phone</label>
        <input id="phone" name="tel" type="tel" placeholder="enter phone number">
        <p id="tel-help">Format: +251 followed by 9 digits.</p>        
        <br>
        <label for="email">Email</label>
        <input type="email" id="email" placeholder="enter email">
        <br>
        <br>
        <label for="password">Password</label>
        <input type="password" id="password"  placeholder="enter passwoords">
        <br>
        <br>
        <label for="confirm">Confirm</label>
        <input type="password" id="confirm" placeholder="confirm passwoords">
        <br>
        <br>
        <input type="submit">
        <div id="error_area"></div>
        <div class="counter-box">
            <h3 class="total">Total Signed-Up Users: </h3><span id="display_count">0</span>
        </div>

        </form>
        <script src="./script.js"></script>
</body>
</html>
